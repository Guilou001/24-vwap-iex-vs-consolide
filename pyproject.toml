[project]
name = "vic"
version = "1.0.0"
description = "Le VWAP calculé sur IEX contre celui du flux consolidé : ce que 1,4 % du volume fait dire à un signal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "typer>=0.12",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.9", "gvf[figures,marches]"]

[project.scripts]
vic = "vic.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.4.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vic"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
